name: Pull Requests

on:
  pull_request:

permissions:
  actions: write
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linting:
    name: Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0

  build:
    name: Build
    uses: specsnl/github-actions/.github/workflows/build.yml@2.4.1
    needs: linting
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    with:
      runs-on: ${{ matrix.runs-on.os }}
      platform: ${{ matrix.runs-on.platform }}
      image-name: ghcr.io/${{ github.repository_owner }}/packer
      title: packer
      description: Docker Image with HashiCorp Packer and Ansible installed

  merge:
    name: Merge
    uses: specsnl/github-actions/.github/workflows/merge.yml@2.4.1
    needs: build
    with:
      runs-on: ubuntu-24.04
      image-name: ghcr.io/${{ github.repository_owner }}/packer
      title: packer
      description: Docker Image with HashiCorp Packer and Ansible installed

  check:
    name: Check
    runs-on: ubuntu-24.04
    needs: [linting, build, merge]
    if: always()
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      - run: exit 0
